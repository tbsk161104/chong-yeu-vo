<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cố lên vợ iuu , chồng yêu em ❤️</title>
    
    <!-- Meta tags chống lưu đệm (Anti-cache) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta property="og:title" content="Cố lên vợ iuu , chồng yêu em ❤️">
    <meta property="og:description" content="Trái tim tình yêu 3D phát sáng & món quà dành tặng vợ yêu">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,500;0,700;1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            background-color: #06020a;
            color: #fff;
        }

        /* Top Navigation Tabs (Y hệt video Dev Pan) */
        .top-nav {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            background: rgba(25, 12, 35, 0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 5px 8px;
            border-radius: 30px;
            border: 1px solid rgba(255, 105, 180, 0.25);
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .nav-tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            font-family: 'Mali', cursive;
            color: #d1b8d8;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-tab:hover {
            color: #fff;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, #ff4b72, #ff758c);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 75, 114, 0.45);
        }

        /* Main View Container */
        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.6s ease;
        }

        #viewport.flower-mode {
            background: radial-gradient(circle at center, #fff0f3 0%, #fde4ea 50%, #fcd2dc 100%);
        }

        /* Canvas for 3D Heart & Stars */
        #heartCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }

        #heartCanvas:active {
            cursor: grabbing;
        }

        /* Subtitle Hint under Heart / Flower */
        .hint-text {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Mali', cursive;
            font-size: 17px;
            font-weight: 600;
            color: #ff9ebd;
            text-shadow: 0 0 12px rgba(255, 110, 160, 0.65);
            z-index: 10;
            cursor: pointer;
            animation: breatheHint 2.4s ease-in-out infinite;
            pointer-events: auto;
            text-align: center;
            white-space: nowrap;
        }

        .flower-mode .hint-text {
            color: #d84570;
            text-shadow: 0 2px 8px rgba(216, 69, 112, 0.3);
        }

        @keyframes breatheHint {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.85; }
            50% { transform: translateX(-50%) scale(1.08); opacity: 1; }
        }

        /* Flower Mode: Tulip Bouquet Center */
        .flower-stage {
            display: none;
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            cursor: pointer;
            text-align: center;
        }

        .flower-stage img {
            width: 270px;
            max-width: 80vw;
            filter: drop-shadow(0 15px 30px rgba(230, 80, 120, 0.3));
            animation: floatBouquet 4s ease-in-out infinite;
            transition: transform 0.3s ease;
        }

        .flower-stage:hover img {
            transform: scale(1.05);
        }

        @keyframes floatBouquet {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(1.5deg); }
        }



        /* Romantic Message Modal (Popup Card) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: rgba(28, 14, 38, 0.92);
            border: 1.5px solid rgba(255, 110, 160, 0.35);
            box-shadow: 0 20px 60px rgba(255, 45, 117, 0.35);
            border-radius: 28px;
            padding: 32px 28px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            transform: scale(0.85) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .flower-mode-modal .modal-box {
            background: rgba(255, 255, 255, 0.95);
            border: 1.5px solid rgba(255, 180, 200, 0.5);
            box-shadow: 0 20px 60px rgba(230, 80, 120, 0.25);
        }

        .flower-mode-modal .modal-msg {
            color: #4a2d38;
        }

        .flower-mode-modal .modal-subtitle {
            color: #8c5b6e;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1) translateY(0);
        }

        .modal-title {
            font-family: 'Mali', cursive;
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff758c, #ff4b72);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .modal-subtitle {
            font-size: 14px;
            color: #d8b8e0;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .modal-msg {
            font-size: 17px;
            line-height: 1.6;
            color: #f7e8f5;
            margin-bottom: 24px;
            font-weight: 600;
        }

        .modal-btn-close {
            font-family: 'Mali', cursive;
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff4b72, #ff758c);
            color: #fff;
            border: none;
            outline: none;
            padding: 11px 36px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 75, 114, 0.45);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .modal-btn-close:hover {
            transform: scale(1.06);
            box-shadow: 0 8px 25px rgba(255, 75, 114, 0.65);
        }

        .modal-btn-close:active {
            transform: scale(0.96);
        }

        /* Play Music Pill (Bottom Left) */
        .music-pill {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(25, 12, 35, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 105, 180, 0.3);
            border-radius: 50px;
            padding: 8px 18px 8px 10px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .music-pill:hover {
            border-color: rgba(255, 105, 180, 0.6);
            transform: scale(1.04);
        }

        .music-icon-wrap {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4b72, #ff758c);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            box-shadow: 0 2px 10px rgba(255, 75, 114, 0.5);
            transition: transform 0.3s ease;
        }

        .music-pill.playing .music-icon-wrap {
            animation: pulseIcon 1.2s infinite;
        }

        @keyframes pulseIcon {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .music-label {
            font-size: 14px;
            font-weight: 700;
            color: #ffe6ef;
            font-family: 'Mali', cursive;
        }
    </style>
</head>
<body>

    <!-- Audio Element: TikTok song from video (CONGB - Chờ chút remix) -->
    <audio id="bgMusic" src="panbap_tiktok_song.mp3" preload="auto" loop></audio>

    <!-- Top Navigation Bar (Tabs y hệt video) -->
    <nav class="top-nav">
        <div class="nav-tab active" data-mode="myheart">
            <span>✨</span> Myheart
        </div>
        <div class="nav-tab" data-mode="lovely">
            <span>💖</span> Lovely
        </div>
        <div class="nav-tab" data-mode="flower">
            <span>🌷</span> Flower
        </div>
    </nav>

    <!-- Main Viewport -->
    <div id="viewport">
        <!-- 3D Heart Canvas -->
        <canvas id="heartCanvas"></canvas>

        <!-- Flower Mode Center Bouquet -->
        <div class="flower-stage" id="flowerStage">
            <img src="tulip_bouquet_clean.png" alt="Bó hoa tulip">
        </div>

        <!-- Subtitle Hint -->
        <div class="hint-text" id="hintText">Chạm vào trái tim nha ❤️</div>


    </div>

    <!-- Romantic Modal Popup (Card lời nhắn) -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h2 class="modal-title" id="modalHeader">Chào Công Chúa</h2>
            <p class="modal-subtitle">Gửi người anh yêu thương nhất ✨</p>
            <p class="modal-msg" id="modalBody">
                Cố lên vợ iuu , chồng yêu em ❤️<br>
                Mãi yêu công chúa của anh! Lúc nào cũng có chồng ở đây bên cạnh vợ.
            </p>
            <button class="modal-btn-close" id="btnCloseModal">
                Đóng <span>❤️</span>
            </button>
        </div>
    </div>

    <!-- Play Music Pill Button -->
    <div class="music-pill" id="btnMusic">
        <div class="music-icon-wrap">❤️</div>
        <span class="music-label" id="musicLabel">Play Music</span>
    </div>

    <!-- Canvas 3D Heart & Galaxy Script -->
    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('bgMusic');
        const btnMusic = document.getElementById('btnMusic');
        const musicLabel = document.getElementById('musicLabel');
        const hintText = document.getElementById('hintText');
        const modalOverlay = document.getElementById('modalOverlay');
        const btnCloseModal = document.getElementById('btnCloseModal');
        const flowerStage = document.getElementById('flowerStage');
        const viewport = document.getElementById('viewport');
        const modalHeader = document.getElementById('modalHeader');

        let currentMode = 'myheart'; // 'myheart', 'lovely', 'flower'
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // ==========================================
        // 3D PARAMETRIC HEART GENERATION
        // ==========================================
        const HEART_PARTICLES_COUNT = 2800;
        const heartPoints = [];

        function heartParametric(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return { x, y };
        }

        // Generate dense volume of 3D points in heart shape
        for (let i = 0; i < HEART_PARTICLES_COUNT; i++) {
            const t = Math.random() * Math.PI * 2;
            const hp = heartParametric(t);
            const scaleFactor = 12 + Math.random() * 2.5;

            // Depth calculation: thickness is proportional to heart contour
            const maxZ = Math.max(3, 16 - Math.abs(hp.y * 0.7));
            const z = (Math.random() - 0.5) * 2 * maxZ;
            
            // Random distribution through heart volume
            const r = Math.pow(Math.random(), 0.5);
            const x = hp.x * scaleFactor * r;
            const y = hp.y * scaleFactor * r;

            // Palette of glowing pinks, crimson, and bright star white
            const colors = ['#ffffff', '#ff758c', '#ff2e93', '#ff4b72', '#ffb3c6', '#e02479'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const size = Math.random() < 0.25 ? (2.2 + Math.random() * 1.5) : (1.0 + Math.random() * 1.2);

            heartPoints.push({
                x, y, z: z * scaleFactor * 0.65,
                baseX: x, baseY: y, baseZ: z * scaleFactor * 0.65,
                color, size,
                speed: 0.8 + Math.random() * 0.4,
                phase: Math.random() * Math.PI * 2
            });
        }

        // ==========================================
        // BACKGROUND STARS
        // ==========================================
        const STAR_COUNT = 180;
        const stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 1.8 + 0.5,
                alpha: Math.random(),
                dAlpha: (Math.random() * 0.02 + 0.005) * (Math.random() < 0.5 ? 1 : -1),
                color: Math.random() < 0.4 ? '#ffb6c1' : '#ffffff'
            });
        }

        // ==========================================
        // GALAXY RING & 3D ORBITING TEXT (MYHEART MODE)
        // ==========================================
        const GALAXY_STARS_COUNT = 450;
        const galaxyStars = [];
        for (let i = 0; i < GALAXY_STARS_COUNT; i++) {
            const angle = Math.random() * Math.PI * 2;
            const rad = 140 + Math.random() * 170;
            galaxyStars.push({
                angle,
                radius: rad,
                speed: 0.003 + Math.random() * 0.004,
                yOffset: (Math.random() - 0.5) * 35,
                size: Math.random() * 1.6 + 0.6,
                color: Math.random() < 0.6 ? '#ff758c' : '#ffffff'
            });
        }

        // Orbiting phrases along the disk
        const orbitPhrases = ["Yêu em", "Cố lên vợ iuu", "Mãi bên nhau", "Yêu em", "Chồng yêu vợ", "Hạnh phúc nhé"];
        const phraseObjects = orbitPhrases.map((text, idx) => ({
            text,
            angle: (idx / orbitPhrases.length) * Math.PI * 2,
            radius: 200,
            speed: 0.006
        }));

        // ==========================================
        // 3D ROTATION & INTERACTION
        // ==========================================
        let rotX = 0.15;
        let rotY = 0;
        let targetRotX = 0.15;
        let targetRotY = 0;
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        function onPointerDown(e) {
            isDragging = true;
            lastMouseX = e.clientX || (e.touches && e.touches[0].clientX);
            lastMouseY = e.clientY || (e.touches && e.touches[0].clientY);
            tryPlayAudio();
        }

        function onPointerMove(e) {
            if (!isDragging) return;
            const curX = e.clientX || (e.touches && e.touches[0].clientX);
            const curY = e.clientY || (e.touches && e.touches[0].clientY);
            const deltaX = curX - lastMouseX;
            const deltaY = curY - lastMouseY;
            targetRotY += deltaX * 0.008;
            targetRotX -= deltaY * 0.008;
            targetRotX = Math.max(-0.6, Math.min(0.6, targetRotX));
            lastMouseX = curX;
            lastMouseY = curY;
        }

        function onPointerUp() {
            isDragging = false;
        }

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('touchstart', onPointerDown, { passive: true });
        window.addEventListener('touchmove', onPointerMove, { passive: true });
        window.addEventListener('touchend', onPointerUp);

        // ==========================================
        // AUDIO CONTROLS
        // ==========================================
        let isAudioPlaying = false;

        function tryPlayAudio() {
            if (isAudioPlaying) return;
            audio.play().then(() => {
                isAudioPlaying = true;
                btnMusic.classList.add('playing');
                musicLabel.textContent = "Pause Music";
            }).catch(() => {});
        }

        btnMusic.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isAudioPlaying) {
                audio.pause();
                isAudioPlaying = false;
                btnMusic.classList.remove('playing');
                musicLabel.textContent = "Play Music";
            } else {
                audio.play().then(() => {
                    isAudioPlaying = true;
                    btnMusic.classList.add('playing');
                    musicLabel.textContent = "Pause Music";
                });
            }
        });

        // ==========================================
        // MODAL & CARDS INTERACTION
        // ==========================================
        function openModal() {
            tryPlayAudio();
            if (currentMode === 'flower') {
                modalOverlay.classList.add('flower-mode-modal');
            } else {
                modalOverlay.classList.remove('flower-mode-modal');
            }
            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        // Tap heart or flower or hint opens modal
        hintText.addEventListener('click', openModal);
        flowerStage.addEventListener('click', openModal);
        canvas.addEventListener('click', (e) => {
            if (currentMode !== 'flower') {
                const dx = e.clientX - width / 2;
                const dy = e.clientY - height / 2;
                if (Math.hypot(dx, dy) < 180) {
                    openModal();
                }
            }
        });

        btnCloseModal.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });

        // ==========================================
        // TOP NAVIGATION TAB SWITCHING
        // ==========================================
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentMode = tab.dataset.mode;
                applyMode(currentMode);
            });
        });

        function applyMode(mode) {
            tryPlayAudio();
            if (mode === 'myheart') {
                viewport.classList.remove('flower-mode');
                canvas.style.display = 'block';
                flowerStage.style.display = 'none';
                hintText.textContent = "Cố lên vợ iuu , chồng yêu em ❤️";
                modalHeader.textContent = "Cố lên vợ iuu";
            } else if (mode === 'lovely') {
                viewport.classList.remove('flower-mode');
                canvas.style.display = 'block';
                flowerStage.style.display = 'none';
                hintText.textContent = "Chạm vào trái tim nha ❤️";
                modalHeader.textContent = "Chào Công Chúa";
            } else if (mode === 'flower') {
                viewport.classList.add('flower-mode');
                canvas.style.display = 'block';
                flowerStage.style.display = 'block';
                hintText.textContent = "Chạm vào hoa nhé 🌷";
                modalHeader.textContent = "Chào em";
            }
        }

        // Flower Mode falling petals
        const FLOWER_PETALS_COUNT = 45;
        const flowerPetals = [];
        for (let i = 0; i < FLOWER_PETALS_COUNT; i++) {
            flowerPetals.push({
                x: Math.random() * width,
                y: Math.random() * height - height,
                vx: (Math.random() - 0.5) * 1.5,
                vy: Math.random() * 2 + 1.2,
                rot: Math.random() * 360,
                vRot: (Math.random() - 0.5) * 2,
                size: Math.random() * 12 + 10,
                color: Math.random() < 0.6 ? '#ffb3c6' : '#ffd1dc'
            });
        }

        // ==========================================
        // ANIMATION LOOP (60 FPS 3D ENGINE)
        // ==========================================
        let clock = 0;

        function animate() {
            requestAnimationFrame(animate);
            clock += 0.035;

            // In Flower Mode: draw falling petals on canvas
            if (currentMode === 'flower') {
                ctx.clearRect(0, 0, width, height);
                for (let p of flowerPetals) {
                    p.y += p.vy;
                    p.x += Math.sin(clock + p.rot) * 0.8;
                    p.rot += p.vRot;
                    if (p.y > height + 30) {
                        p.y = -30;
                        p.x = Math.random() * width;
                    }
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = 0.7;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
                return;
            }

            ctx.clearRect(0, 0, width, height);

            // 1. Draw Twinkling Background Stars
            for (let s of stars) {
                s.alpha += s.dAlpha;
                if (s.alpha > 1 || s.alpha < 0.15) s.dAlpha = -s.dAlpha;
                ctx.fillStyle = s.color;
                ctx.globalAlpha = Math.max(0.1, Math.min(1, s.alpha));
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            }

            // 2. Smooth Rotations (Slow auto-rotate + inertia)
            targetRotY += 0.0035;
            rotX += (targetRotX - rotX) * 0.08;
            rotY += (targetRotY - rotY) * 0.08;

            const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
            const cosY = Math.cos(rotY), sinY = Math.sin(rotY);

            // Realistic Human Double-Pulse Heartbeat
            // lub-dub beat cycle: beat 1, pause, beat 2, long pause
            const beatCycle = (clock * 1.8) % (Math.PI * 2);
            let pulse = 0;
            if (beatCycle < 0.8) {
                pulse = Math.sin(beatCycle * Math.PI / 0.8) * 0.14;
            } else if (beatCycle > 1.0 && beatCycle < 1.6) {
                pulse = Math.sin((beatCycle - 1.0) * Math.PI / 0.6) * 0.09;
            }
            const heartScale = 1 + pulse;

            const cx = width / 2;
            const cy = height / 2 - 25;
            const focalLength = 650;

            // 3. Draw Galaxy Ring (Only in Myheart Mode)
            if (currentMode === 'myheart') {
                // Galaxy Star Ring
                for (let gs of galaxyStars) {
                    gs.angle += gs.speed;
                    const gx = Math.cos(gs.angle) * gs.radius;
                    const gz = Math.sin(gs.angle) * gs.radius;
                    const gy = gs.yOffset + 140;

                    // 3D Rotation
                    const x1 = gx * cosY + gz * sinY;
                    const z1 = -gx * sinY + gz * cosY;
                    const y2 = gy * cosX - z1 * sinX;
                    const z2 = gy * sinX + z1 * cosX;

                    const scale = focalLength / (focalLength + z2 + 200);
                    const screenX = cx + x1 * scale;
                    const screenY = cy + y2 * scale;

                    ctx.fillStyle = gs.color;
                    ctx.globalAlpha = Math.max(0.2, Math.min(0.9, (z2 + 250) / 450));
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, gs.size * scale, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 3D Orbiting Text along the ring
                ctx.font = "bold 14px 'Mali', cursive";
                ctx.textAlign = "center";
                for (let p of phraseObjects) {
                    p.angle += p.speed;
                    const px = Math.cos(p.angle) * p.radius;
                    const pz = Math.sin(p.angle) * p.radius;
                    const py = 135;

                    const x1 = px * cosY + pz * sinY;
                    const z1 = -px * sinY + pz * cosY;
                    const y2 = py * cosX - z1 * sinX;
                    const z2 = py * sinX + z1 * cosX;

                    const scale = focalLength / (focalLength + z2 + 200);
                    const screenX = cx + x1 * scale;
                    const screenY = cy + y2 * scale;

                    const alpha = Math.max(0.2, Math.min(1.0, (z2 + 220) / 400));
                    ctx.fillStyle = `rgba(255, 175, 205, ${alpha})`;
                    ctx.shadowColor = "rgba(255, 105, 180, 0.8)";
                    ctx.shadowBlur = 10 * scale;
                    ctx.save();
                    ctx.translate(screenX, screenY);
                    ctx.scale(scale, scale);
                    ctx.fillText(p.text, 0, 0);
                    ctx.restore();
                    ctx.shadowBlur = 0;
                }
            }

            // 4. Draw 3D Particle Heart
            // Render particles sorted by depth Z for correct layering
            const projectedPoints = [];
            for (let i = 0; i < heartPoints.length; i++) {
                const p = heartPoints[i];

                // Flutter / pulsation
                const curX = p.baseX * heartScale;
                const curY = p.baseY * heartScale;
                const curZ = p.baseZ * heartScale;

                // 3D Rotate around Y then X
                const x1 = curX * cosY + curZ * sinY;
                const z1 = -curX * sinY + curZ * cosY;
                const y2 = curY * cosX - z1 * sinX;
                const z2 = curY * sinX + z1 * cosX;

                const scale = focalLength / (focalLength + z2 + 120);
                const screenX = cx + x1 * scale;
                const screenY = cy + y2 * scale;

                projectedPoints.push({
                    screenX, screenY, z2, scale,
                    color: p.color,
                    size: p.size * scale * (1 + pulse * 1.5)
                });
            }

            // Depth sorting
            projectedPoints.sort((a, b) => a.z2 - b.z2);

            // Draw composite glow
            ctx.globalCompositeOperation = 'lighter';
            for (let i = 0; i < projectedPoints.length; i++) {
                const pt = projectedPoints[i];
                const alpha = Math.max(0.25, Math.min(1, (pt.z2 + 180) / 360));

                ctx.fillStyle = pt.color;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(pt.screenX, pt.screenY, pt.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;
        }

        animate();
    </script>
</body>
