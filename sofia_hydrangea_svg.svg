<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Hydrangea Petal Gradients -->
    <linearGradient id="hydrangeaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="40%" stop-color="#90caf9"/>
      <stop offset="100%" stop-color="#42a5f5"/>
    </linearGradient>
    <linearGradient id="hydrangeaPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5f5"/>
      <stop offset="45%" stop-color="#ce93d8"/>
      <stop offset="100%" stop-color="#ab47bc"/>
    </linearGradient>
    <linearGradient id="hydrangeaPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="45%" stop-color="#f48fb1"/>
      <stop offset="100%" stop-color="#ec407a"/>
    </linearGradient>

    <!-- Sofia Flower Gradients (Peony Rose petals) -->
    <linearGradient id="sofiaCream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fff5f5"/>
      <stop offset="80%" stop-color="#ffd1dc"/>
      <stop offset="100%" stop-color="#f8a5c2"/>
    </linearGradient>
    <linearGradient id="sofiaBlush" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fed7e2"/>
      <stop offset="75%" stop-color="#fbb6ce"/>
      <stop offset="100%" stop-color="#f687b3"/>
    </linearGradient>

    <!-- Leaves & Stem Gradients -->
    <linearGradient id="eucalyptusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80cbc4"/>
      <stop offset="50%" stop-color="#4db6ac"/>
      <stop offset="100%" stop-color="#00695c"/>
    </linearGradient>
    <linearGradient id="ribbonSilk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8e1eb"/>
      <stop offset="50%" stop-color="#e8b4c8"/>
      <stop offset="100%" stop-color="#d48ba7"/>
    </linearGradient>
  </defs>

  <g transform="translate(250, 270)">
    <!-- Stems -->
    <path d="M-20,60 Q-35,140 -25,220" stroke="#2e7d32" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M0,65 Q-8,145 0,225" stroke="#1b5e20" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M20,60 Q30,140 22,220" stroke="#388e3c" stroke-width="10" fill="none" stroke-linecap="round"/>

    <!-- Eucalyptus & Sage Leaves -->
    <path d="M-30,100 Q-120,60 -150,105 Q-110,130 -25,115" fill="url(#eucalyptusGrad)"/>
    <path d="M30,110 Q120,70 155,115 Q110,140 25,125" fill="url(#eucalyptusGrad)"/>
    <path d="M-15,150 Q-90,170 -120,205 Q-70,210 -10,170" fill="url(#eucalyptusGrad)"/>
    <path d="M15,155 Q90,175 120,210 Q70,215 10,175" fill="url(#eucalyptusGrad)"/>

    <!-- CẨM TÚ CẦU CLUSTERS (Hydrangea Florets Background) -->
    <!-- Left Blue Hydrangea Cluster -->
    <g transform="translate(-100, -50)">
      <!-- 4-petal florets -->
      <g transform="translate(-25, -20) scale(0.7)">
        <ellipse cx="-10" cy="0" rx="9" ry="7" fill="url(#hydrangeaBlue)"/>
        <ellipse cx="10" cy="0" rx="9" ry="7" fill="url(#hydrangeaBlue)"/>
        <ellipse cx="0" cy="-10" rx="7" ry="9" fill="url(#hydrangeaBlue)"/>
        <ellipse cx="0" cy="10" rx="7" ry="9" fill="url(#hydrangeaBlue)"/>
        <circle cx="0" cy="0" r="2.5" fill="#fff9c4"/>
      </g>
      <g transform="translate(15, -30) scale(0.8)">
        <ellipse cx="-10" cy="0" rx="9" ry="7" fill="url(#hydrangeaBlue)"/>
        <ellipse cx="10" cy="0" rx="9" ry="7" fill="url(#hydrangeaBlue)"/>
        <ellipse cx="0" cy="-10" rx="7" ry="9" fill="url(#hydrangeaBlue)"/>
        <ellipse cx="0" cy="10" rx="7" ry="9" fill="url(#hydrangeaBlue)"/>
        <circle cx="0" cy="0" r="2.5" fill="#fff9c4"/>
      </g>
      <g transform="translate(-10, 15) scale(0.75)">
        <ellipse cx="-10" cy="0" rx="9" ry="7" fill="url(#hydrangeaPurple)"/>
        <ellipse cx="10" cy="0" rx="9" ry="7" fill="url(#hydrangeaPurple)"/>
        <ellipse cx="0" cy="-10" rx="7" ry="9" fill="url(#hydrangeaPurple)"/>
        <ellipse cx="0" cy="10" rx="7" ry="9" fill="url(#hydrangeaPurple)"/>
        <circle cx="0" cy="0" r="2.5" fill="#fff9c4"/>
      </g>
      <g transform="translate(-35, 10) scale(0.7)">
        <ellipse cx="-10" cy="0" rx="9" ry="7" fill="url(#hydrangeaBlue)"/>
        <ellipse cx="10" cy="0" rx="9" ry="7" fill="url(#hydrangeaBlue)"/>
        <ellipse cx="0" cy="-10" rx="7" ry="9" fill="url(#hydrangeaBlue)"/>
        <ellipse cx="0" cy="10" rx="7" ry="9" fill="url(#hydrangeaBlue)"/>
        <circle cx="0" cy="0" r="2.5" fill="#fff9c4"/>
      </g>
    </g>

    <!-- Right Lavender/Pink Hydrangea Cluster -->
    <g transform="translate(100, -45)">
      <g transform="translate(-15, -25) scale(0.75)">
        <ellipse cx="-10" cy="0" rx="9" ry="7" fill="url(#hydrangeaPurple)"/>
        <ellipse cx="10" cy="0" rx="9" ry="7" fill="url(#hydrangeaPurple)"/>
        <ellipse cx="0" cy="-10" rx="7" ry="9" fill="url(#hydrangeaPurple)"/>
        <ellipse cx="0" cy="10" rx="7" ry="9" fill="url(#hydrangeaPurple)"/>
        <circle cx="0" cy="0" r="2.5" fill="#fff9c4"/>
      </g>
      <g transform="translate(25, -20) scale(0.8)">
        <ellipse cx="-10" cy="0" rx="9" ry="7" fill="url(#hydrangeaPink)"/>
        <ellipse cx="10" cy="0" rx="9" ry="7" fill="url(#hydrangeaPink)"/>
        <ellipse cx="0" cy="-10" rx="7" ry="9" fill="url(#hydrangeaPink)"/>
        <ellipse cx="0" cy="10" rx="7" ry="9" fill="url(#hydrangeaPink)"/>
        <circle cx="0" cy="0" r="2.5" fill="#fff9c4"/>
      </g>
      <g transform="translate(10, 18) scale(0.7)">
        <ellipse cx="-10" cy="0" rx="9" ry="7" fill="url(#hydrangeaPurple)"/>
        <ellipse cx="10" cy="0" rx="9" ry="7" fill="url(#hydrangeaPurple)"/>
        <ellipse cx="0" cy="-10" rx="7" ry="9" fill="url(#hydrangeaPurple)"/>
        <ellipse cx="0" cy="10" rx="7" ry="9" fill="url(#hydrangeaPurple)"/>
        <circle cx="0" cy="0" r="2.5" fill="#fff9c4"/>
      </g>
    </g>

    <!-- HOA SOFIA MAIN BLOOMS (Layered Ruffled Peony/Rose Blossoms) -->
    <!-- Left Sofia Bloom -->
    <g transform="translate(-55, -25) rotate(-15) scale(0.9)">
      <circle cx="0" cy="0" r="48" fill="url(#sofiaBlush)" opacity="0.6"/>
      <!-- Outer Ruffled Petals -->
      <path d="M-40,-15 Q-55,-45 -20,-55 Q-5,-45 0,-30" fill="url(#sofiaBlush)"/>
      <path d="M0,-30 Q25,-55 45,-35 Q40,-15 25,-10" fill="url(#sofiaCream)"/>
      <path d="M-45,5 Q-55,35 -25,45 Q-10,35 -5,15" fill="url(#sofiaBlush)"/>
      <path d="M5,15 Q35,45 50,25 Q45,5 25,5" fill="url(#sofiaCream)"/>
      <!-- Inner Swirling Petals -->
      <circle cx="0" cy="0" r="28" fill="url(#sofiaCream)"/>
      <path d="M-15,-10 Q-25,-25 0,-25 Q15,-20 15,-5 Q10,15 -10,12 Z" fill="#fbb6ce"/>
      <path d="M-8,-5 Q-15,-15 0,-15 Q10,-10 8,0 Q5,8 -5,6 Z" fill="#f687b3"/>
    </g>

    <!-- Right Sofia Bloom -->
    <g transform="translate(55, -30) rotate(18) scale(0.9)">
      <circle cx="0" cy="0" r="48" fill="url(#sofiaCream)" opacity="0.6"/>
      <path d="M-40,-15 Q-55,-45 -20,-55 Q-5,-45 0,-30" fill="url(#sofiaCream)"/>
      <path d="M0,-30 Q25,-55 45,-35 Q40,-15 25,-10" fill="url(#sofiaBlush)"/>
      <path d="M-45,5 Q-55,35 -25,45 Q-10,35 -5,15" fill="url(#sofiaCream)"/>
      <path d="M5,15 Q35,45 50,25 Q45,5 25,5" fill="url(#sofiaBlush)"/>
      <circle cx="0" cy="0" r="28" fill="url(#sofiaBlush)"/>
      <path d="M-15,-10 Q-25,-25 0,-25 Q15,-20 15,-5 Q10,15 -10,12 Z" fill="#fbb6ce"/>
      <path d="M-8,-5 Q-15,-15 0,-15 Q10,-10 8,0 Q5,8 -5,6 Z" fill="#f687b3"/>
    </g>

    <!-- Center Queen Sofia Bloom -->
    <g transform="translate(0, -5) scale(1.15)">
      <circle cx="0" cy="0" r="58" fill="url(#sofiaBlush)" opacity="0.5"/>
      <!-- Grand Layered Petals -->
      <path d="M-50,-20 Q-65,-60 -20,-70 Q-5,-50 0,-35" fill="url(#sofiaCream)"/>
      <path d="M0,-35 Q30,-65 55,-40 Q50,-15 30,-10" fill="url(#sofiaBlush)"/>
      <path d="M-55,10 Q-65,50 -30,60 Q-10,45 -5,20" fill="url(#sofiaBlush)"/>
      <path d="M5,20 Q40,55 60,30 Q50,10 30,10" fill="url(#sofiaCream)"/>
      <path d="M-30,40 Q0,70 30,45 Q15,30 0,30" fill="url(#sofiaCream)"/>
      <!-- Inner Heart of Sofia Peony -->
      <circle cx="0" cy="0" r="35" fill="url(#sofiaCream)"/>
      <path d="M-20,-15 Q-30,-35 0,-35 Q20,-30 20,-10 Q15,20 -15,15 Z" fill="#fbb6ce"/>
      <path d="M-12,-8 Q-18,-20 0,-20 Q12,-15 10,0 Q6,12 -8,8 Z" fill="#f687b3"/>
      <circle cx="0" cy="0" r="6" fill="#fce4ec"/>
    </g>

    <!-- Silk Satin Ribbon Bow -->
    <g transform="translate(0, 135)">
      <path d="M-10,10 Q-45,70 -65,120 Q-45,115 -25,80 Q-15,50 -5,10" fill="url(#ribbonSilk)"/>
      <path d="M10,10 Q45,70 65,120 Q45,115 25,80 Q15,50 5,10" fill="url(#ribbonSilk)"/>
      <path d="M0,0 C-65,-45 -75,25 0,10" fill="url(#ribbonSilk)"/>
      <path d="M0,0 C65,-45 75,25 0,10" fill="url(#ribbonSilk)"/>
      <ellipse cx="0" cy="5" rx="15" ry="12" fill="#d48ba7" stroke="#f8e1eb" stroke-width="2"/>
    </g>
  </g>
</svg>
