  <path d="M 43,128 Q 70,115 64,92 Q 48,105 43,124 Z" fill="#8bc34a"/>
  <!-- Daisy Blossom Head -->
  <g transform="translate(42, 50)">
    <!-- 12 White Petals with subtle soft gray drop -->
    <g fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8">
      <ellipse cx="0" cy="-28" rx="6.5" ry="15"/>
      <ellipse cx="14" cy="-24" rx="6.5" ry="15" transform="rotate(30 14 -24)"/>
      <ellipse cx="24" cy="-14" rx="6.5" ry="15" transform="rotate(60 24 -14)"/>
      <ellipse cx="28" cy="0" rx="6.5" ry="15" transform="rotate(90 28 0)"/>
      <ellipse cx="24" cy="14" rx="6.5" ry="15" transform="rotate(120 24 14)"/>
      <ellipse cx="14" cy="24" rx="6.5" ry="15" transform="rotate(150 14 24)"/>
      <ellipse cx="0" cy="28" rx="6.5" ry="15" transform="rotate(180 0 28)"/>
      <ellipse cx="-14" cy="24" rx="6.5" ry="15" transform="rotate(210 -14 24)"/>
      <ellipse cx="-24" cy="14" rx="6.5" ry="15" transform="rotate(240 -24 14)"/>
      <ellipse cx="-28" cy="0" rx="6.5" ry="15" transform="rotate(270 -28 0)"/>
      <ellipse cx="-24" cy="-14" rx="6.5" ry="15" transform="rotate(300 -24 -14)"/>
      <ellipse cx="-14" cy="-24" rx="6.5" ry="15" transform="rotate(330 -14 -24)"/>
    </g>
    <!-- Yellow Eye Disk -->
    <circle cx="0" cy="0" r="14" fill="#fbc02d"/>
    <circle cx="0" cy="0" r="11" fill="#f57f17"/>
    <circle cx="0" cy="0" r="8" fill="#fbc02d"/>
