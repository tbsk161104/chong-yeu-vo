<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 180" width="90" height="180">
  <!-- Stem -->
  <path d="M 45,75 Q 44,130 45,175" stroke="#558b2f" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Left Leaf -->
  <path d="M 44,140 Q 12,125 20,100 Q 38,115 44,135 Z" fill="#689f38"/>
  <!-- Right Leaf -->
  <path d="M 46,125 Q 78,110 70,85 Q 52,100 46,120 Z" fill="#7cb342"/>
  <!-- Sunflower Blossom -->
  <g transform="translate(45, 50)">
    <!-- 12 Petals -->
    <g fill="#fbc02d" stroke="#f57f17" stroke-width="0.8">
      <ellipse cx="0" cy="-30" rx="8" ry="16"/>
      <ellipse cx="15" cy="-26" rx="8" ry="16" transform="rotate(30 15 -26)"/>
      <ellipse cx="26" cy="-15" rx="8" ry="16" transform="rotate(60 26 -15)"/>
      <ellipse cx="30" cy="0" rx="8" ry="16" transform="rotate(90 30 0)"/>
      <ellipse cx="26" cy="15" rx="8" ry="16" transform="rotate(120 26 15)"/>
      <ellipse cx="15" cy="26" rx="8" ry="16" transform="rotate(150 15 26)"/>
      <ellipse cx="0" cy="30" rx="8" ry="16" transform="rotate(180 0 30)"/>
      <ellipse cx="-15" cy="26" rx="8" ry="16" transform="rotate(210 -15 26)"/>
      <ellipse cx="-26" cy="15" rx="8" ry="16" transform="rotate(240 -26 15)"/>
      <ellipse cx="-30" cy="0" rx="8" ry="16" transform="rotate(270 -30 0)"/>
      <ellipse cx="-26" cy="-15" rx="8" ry="16" transform="rotate(300 -26 -15)"/>
      <ellipse cx="-15" cy="-26" rx="8" ry="16" transform="rotate(330 -15 -26)"/>
    </g>
    <!-- Center Disk -->
    <circle cx="0" cy="0" r="16" fill="#6d4c41"/>
    <circle cx="0" cy="0" r="13" fill="#5d4037"/>
    <circle cx="0" cy="0" r="9" fill="#4e342e"/>
    <!-- Seed dots pattern -->
    <circle cx="-5" cy="-4" r="1.5" fill="#8d6e63"/>
    <circle cx="4" cy="-5" r="1.5" fill="#8d6e63"/>
    <circle cx="5" cy="4" r="1.5" fill="#8d6e63"/>
    <circle cx="-4" cy="5" r="1.5" fill="#8d6e63"/>
    <circle cx="0" cy="0" r="1.8" fill="#8d6e63"/>
  </g>
</svg>